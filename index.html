<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A self-contained, browser-based virtual desktop simulation.">
<title>Virtual PC</title>
<style>
:root{color-scheme:dark;--accent:#75baff;--panel:rgba(20,27,40,.92);--line:rgba(255,255,255,.13);--text:#edf4ff;--muted:#aab8cc}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;color:var(--text);background:#101a2b;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;background:#ffffff12;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{background:#ffffff22}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#desktop{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 20% 20%,#28517a 0,transparent 40%),radial-gradient(ellipse at 80% 80%,#4b3570 0,transparent 38%),linear-gradient(135deg,#102337,#17203a 60%,#111827)}
#icons{position:absolute;inset:12px auto 58px 12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,92px);gap:5px}
.desktop-icon{width:86px;height:82px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}.desktop-icon .glyph{font-size:29px}.desktop-icon span:last-child{font-size:12px;text-shadow:0 1px 3px #000}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#0b1223d9;border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:9999}
#start{font-size:19px;width:42px;height:36px;padding:0}#task-items{display:flex;gap:5px;flex:1;overflow:auto}.task-item{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#clock{font-variant-numeric:tabular-nums;color:var(--muted);padding:0 8px}
.window{position:absolute;min-width:300px;min-height:190px;width:min(720px,calc(100vw - 24px));height:min(470px,calc(100dvh - 82px));background:var(--panel);border:1px solid #ffffff35;border-radius:12px;box-shadow:0 18px 60px #0008;backdrop-filter:blur(22px);display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:40px;flex:none;display:flex;align-items:center;padding:0 8px 0 13px;gap:8px;background:#ffffff0a;border-bottom:1px solid var(--line);cursor:move;user-select:none}.titlebar strong{font-weight:600;flex:1}.win-controls{display:flex;gap:4px}.win-controls button{width:30px;padding:3px}.win-body{padding:12px;overflow:auto;flex:1;min-height:0}.window.maximized{inset:8px!important;width:auto!important;height:auto!important}.window.minimized{display:none}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:120px}.field,input,textarea{background:#0b1223a8;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px}.field{width:100%}textarea{width:100%;height:100%;resize:none;font:13px/1.5 ui-monospace,monospace}.muted{color:var(--muted)}.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.file-entry{padding:12px 8px;text-align:center;min-height:82px}.file-entry .glyph{font-size:25px;display:block}.status{font-size:12px;color:var(--muted);padding:7px 0}.terminal{background:#050a12;color:#c8f7d1;border-radius:8px;padding:12px;height:100%;font:13px/1.55 ui-monospace,monospace;display:flex;flex-direction:column}.terminal-output{white-space:pre-wrap;overflow:auto;flex:1}.terminal form{display:flex;gap:7px}.terminal input{flex:1;border:0;background:transparent;color:#d9ffe1;font:inherit;padding:4px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:330px;margin:auto}.calc input{grid-column:1/-1;text-align:right;font-size:24px}.calc button{padding:15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}.split>*{min-width:0;min-height:0}.preview{width:100%;height:100%;background:white;border:0;border-radius:7px}.danger{border-color:#c66;color:#ffb4b4}.hidden{display:none!important}
@media(max-width:600px){#icons{grid-template-rows:repeat(4,82px);grid-auto-flow:column}.window{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100dvh - 64px)!important}.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.desktop-icon{width:72px}.task-item{max-width:100px}}
</style></head>
<body><main id="desktop" aria-label="Virtual desktop"><div id="icons"></div><div id="windows"></div><nav id="taskbar" aria-label="Taskbar"><button id="start" aria-label="Open app launcher">▦</button><div id="task-items"></div><div id="clock"></div></nav></main>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s), desktop=$("#desktop"), wins=$("#windows"), task=$("#task-items");
const APPS=[["explorer","📁","File Explorer"],["notepad","📝","Notepad"],["terminal","⌘","Terminal"],["calculator","🧮","Calculator"],["studio","🌐","HTML Studio"],["settings","⚙️","Settings"]];
const seed={"Documents/Welcome.txt":"Welcome to Virtual PC.\n\nThis is a browser simulation, not a real operating system. Files live in this app's virtual workspace.","Documents/Notes.txt":"Your notes go here.","Projects/index.html":"<!doctype html>\n<h1>Hello from HTML Studio</h1>\n<p>Edit this file in the virtual desktop.</p>"};
const clone=o=>JSON.parse(JSON.stringify(o));let fs,winSeq=0,z=10,windows=new Map(),cwd="/";
function load(){try{const v=JSON.parse(localStorage.getItem("virtual-pc-fs-v1"));if(v&&v.version===1&&v.files&&typeof v.files==="object")return v.files}catch(e){}return clone(seed)}
fs=load();
function save(){try{localStorage.setItem("virtual-pc-fs-v1",JSON.stringify({version:1,files:fs}))}catch(e){notify("Storage unavailable; changes may not persist.")}}
function notify(s){let n=$("#notice");if(!n){n=document.createElement("div");n.id="notice";n.style.cssText="position:absolute;bottom:58px;right:14px;background:#111d;border:1px solid #789;padding:10px 14px;border-radius:8px;z-index:10000";desktop.append(n)}n.textContent=s;n.classList.remove("hidden");clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.add("hidden"),2600)}
function norm(p){let a=(p.startsWith("/")?p:cwd.replace(/\/$/,"")+"/"+p).split("/"),o=[];for(const x of a){if(!x||x===".")continue;if(x==="..")o.pop();else o.push(x)}return "/"+o.join("/")}
function isDir(p){p=norm(p);return p==="/"||Object.keys(fs).some(k=>k.startsWith(p.replace(/\/$/,"")+"/"))}
function children(p){p=norm(p).replace(/\/$/,"");let prefix=p==="/"?"/":p+"/",set=new Set();for(const k of Object.keys(fs))if(k.startsWith(prefix)){const rest=k.slice(prefix.length);if(rest)set.add(rest.split("/")[0])}return [...set].sort()}
function read(p){return fs[norm(p)]}function write(p,v){p=norm(p);if(!p||p==="/")throw Error("Invalid file path");if(isDir(p))throw Error("A folder already exists at that path");fs[p]=String(v);save()}
function mkdir(p){p=norm(p);if(p==="/")return;if(fs[p]!==undefined||isDir(p))throw Error("Path already exists");fs[p+"/.keep"]="";save();delete fs[p+"/.keep"];save()}
function remove(p){p=norm(p);if(p==="/")throw Error("Cannot delete workspace root");for(const k of Object.keys(fs))if(k===p||k.startsWith(p+"/"))delete fs[k];save()}
function rename(oldp,newp){oldp=norm(oldp);newp=norm(newp);if(!fs[oldp]&&!isDir(oldp))throw Error("Source not found");if(fs[newp]!==undefined||isDir(newp))throw Error("Destination exists");let moved={};for(const k of Object.keys(fs))if(k===oldp||k.startsWith(oldp+"/"))moved[newp+k.slice(oldp.length)]=fs[k];remove(oldp);Object.assign(fs,moved);save()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openApp(id){if(id==="launcher"){launcher();return}const old=[...windows.values()].find(w=>w.id===id);if(old){restore(old.key);return}
const app=APPS.find(a=>a[0]===id);if(!app)return;const key=++winSeq,el=document.createElement("section");el.className="window";el.dataset.key=key;el.style.left=(90+(windows.size*28)%180)+"px";el.style.top=(45+(windows.size*25)%120)+"px";el.style.zIndex=++z;
el.innerHTML='<header class="titlebar"><strong>'+app[1]+' '+app[2]+'</strong><div class="win-controls"><button data-act="min" aria-label="Minimize">−</button><button data-act="max" aria-label="Maximize">□</button><button data-act="close" aria-label="Close">×</button></div></header><div class="win-body"></div>';
wins.append(el);let w={key,id,el,title:app[2]};windows.set(key,w);el.addEventListener("pointerdown",()=>front(w));el.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();({min:()=>minimize(w),max:()=>el.classList.toggle("maximized"),close:()=>close(w)})[b.dataset.act]()});drag(w);renderTask();renderApp(w)}
function front(w){w.el.style.zIndex=++z}
function minimize(w){w.el.classList.add("minimized");renderTask()}function restore(k){const w=windows.get(Number(k));if(w){w.el.classList.remove("minimized");front(w);renderTask()}}
function close(w){w.el.remove();windows.delete(w.key);renderTask()}
function renderTask(){task.replaceChildren();for(const w of windows.values()){const b=document.createElement("button");b.className="task-item";b.textContent=w.title;b.onclick=()=>w.el.classList.contains("minimized")?restore(w.key):minimize(w);task.append(b)}}
function drag(w){const bar=w.el.querySelector(".titlebar");let sx,sy,l,t;bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||w.el.classList.contains("maximized"))return;front(w);sx=e.clientX;sy=e.clientY;const r=w.el.getBoundingClientRect();l=r.left;t=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener("pointermove",e=>{if(!bar.hasPointerCapture(e.pointerId))return;w.el.style.left=Math.max(0,Math.min(innerWidth-120,l+e.clientX-sx))+"px";w.el.style.top=Math.max(0,Math.min(innerHeight-90,t+e.clientY-sy))+"px"});bar.addEventListener("pointerup",e=>{if(bar.hasPointerCapture(e.pointerId))bar.releasePointerCapture(e.pointerId)})}
function body(w){return w.el.querySelector(".win-body")}
function renderApp(w){const b=body(w);if(w.id==="explorer")explorer(w);if(w.id==="notepad")notepad(w);if(w.id==="terminal")terminal(w);if(w.id==="calculator")calculator(w);if(w.id==="studio")studio(w);if(w.id==="settings")settings(w)}
function explorer(w,path=cwd){const b=body(w);cwd=norm(path);b.innerHTML='<div class="toolbar"><button data-up>↑ Up</button><input class="field" aria-label="Folder path" value="'+esc(cwd)+'"><button data-go>Go</button><button data-new-folder>New folder</button><button data-new-file>New file</button></div><div class="file-list"></div><div class="status">Virtual workspace · local browser storage</div>';const input=b.querySelector("input"),list=b.querySelector(".file-list");function draw(){list.replaceChildren();for(const name of children(cwd)){const p=norm(cwd+"/"+name),dir=isDir(p),btn=document.createElement("button");btn.className="file-entry";btn.innerHTML='<span class="glyph">'+(dir?"📁":"📄")+'</span><span>'+esc(name)+'</span>';btn.ondblclick=()=>dir?explorer(w,p):editFile(p);btn.onclick=()=>{list.querySelectorAll("button").forEach(x=>x.style.outline="");btn.style.outline="2px solid var(--accent)";};btn.oncontextmenu=e=>{e.preventDefault();const action=prompt("Type rename or delete");if(action==="delete"&&confirm("Delete "+name+"?")){remove(p);draw()}else if(action==="rename"){const nn=prompt("New name",name);if(nn){rename(p,norm(cwd+"/"+nn));draw()}}};list.append(btn)}}draw();b.querySelector("[data-up]").onclick=()=>explorer(w,norm(cwd+"/.."));b.querySelector("[data-go]").onclick=()=>{if(isDir(input.value))explorer(w,input.value);else notify("Folder not found")};b.querySelector("[data-new-folder]").onclick=()=>{const n=prompt("Folder name");if(n){try{mkdir(cwd+"/"+n);explorer(w,cwd)}catch(e){notify(e.message)}}};b.querySelector("[data-new-file]").onclick=()=>{const n=prompt("File name");if(n){try{write(cwd+"/"+n,"");explorer(w,cwd)}catch(e){notify(e.message)}}}}
function editFile(p){openApp("notepad");const w=[...windows.values()].find(x=>x.id==="notepad");if(w)notepad(w,p)}
function notepad(w,p){p=p||"Documents/Notes.txt";const b=body(w);if(read(p)===undefined){try{write(p,"")}catch(e){}}b.innerHTML='<div class="toolbar"><input class="field" aria-label="File path" value="'+esc(norm(p))+'"><button data-save>Save</button><button data-saveas>Save as</button></div><textarea spellcheck="false" aria-label="Document contents"></textarea><div class="status">Edits are saved to the virtual workspace.</div>';const ta=b.querySelector("textarea"),path=b.querySelector("input");ta.value=read(p)||"";b.querySelector("[data-save]").onclick=()=>{try{write(path.value,ta.value);notify("Saved "+norm(path.value))}catch(e){notify(e.message)}};b.querySelector("[data-saveas]").onclick=()=>{const n=prompt("Save as path",path.value);if(n){path.value=n;b.querySelector("[data-save]").click()}}}
function terminal(w){const b=body(w);b.innerHTML='<div class="terminal"><div class="terminal-output">Virtual PC Terminal · simulated commands only\nType help for commands.\n</div><form><span>guest:~$</span><input aria-label="Terminal command" autocomplete="off"></form></div>';const out=b.querySelector(".terminal-output"),form=b.querySelector("form"),inp=form.querySelector("input");function print(s){out.textContent+=s+"\n";out.scrollTop=out.scrollHeight}form.onsubmit=e=>{e.preventDefault();const raw=inp.value.trim();inp.value="";if(!raw)return;print("guest:~$ "+raw);const [cmd,...args]=raw.split(" "),arg=args.join(" ");try{switch(cmd){case"help":print("help clear pwd ls cd mkdir touch cat echo date rm");break;case"clear":out.textContent="";break;case"pwd":print(cwd);break;case"ls":print(children(cwd).join("   ")||"(empty)");break;case"cd":if(!arg)cwd="/";else if(isDir(arg))cwd=norm(arg);else throw Error("Directory not found");break;case"mkdir":mkdir(arg);break;case"touch":if(!arg)throw Error("Usage: touch filename");write(arg,read(arg)||"");break;case"cat":if(read(arg)===undefined)throw Error("File not found");print(read(arg));break;case"echo":{const m=raw.match(/^echo\s+(.+?)\s+>\s+(.+)$/);if(m)write(m[2],m[1]);else print(args.join(" "));break}case"date":print(new Date().toString());break;case"rm":if(!arg)throw Error("Usage: rm path");if(confirm("Delete "+arg+" from virtual workspace?"))remove(arg);break;default:print("Unknown command: "+cmd+" (try help)")}}catch(e){print("Error: "+e.message)}}}
function calculator(w){const b=body(w);b.innerHTML='<div class="calc"><input aria-label="Calculator display" readonly value="0"><button>C</button><button>⌫</button><button>(</button><button>)</button>'+["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","=","+"].map(x=>'<button>'+x+'</button>').join("")+'</div>';const d=b.querySelector("input");b.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{const x=btn.textContent;if(x==="C")d.value="0";else if(x==="⌫")d.value=d.value.slice(0,-1)||"0";else if(x==="="){try{d.value=String(safeMath(d.value))}catch(e){d.value="Error"}}else d.value=d.value==="0"?x:d.value+x})}
function safeMath(s){s=s.replace(/[×]/g,"*").replace(/[÷]/g,"/").replace(/[−]/g,"-");if(!/^[0-9+*/().\s-]+$/.test(s)||s.length>100)throw Error("Invalid expression");const tokens=s.match(/\d+(?:\.\d+)?|[()+*/-]/g)||[];let i=0;function atom(){let t=tokens[i++];if(t==="("){let v=expr();if(tokens[i++]!==")")throw Error("Missing )");return v}if(t==="-" )return -atom();if(t==="+" )return atom();if(!t||!/^\d/.test(t))throw Error("Expected number");return Number(t)}function term(){let v=atom();while(tokens[i]==="*"||tokens[i]==="/"){let op=tokens[i++],n=atom();v=op==="*"?v*n:v/n}return v}function expr(){let v=term();while(tokens[i]==="+"||tokens[i]==="-"){let op=tokens[i++],n=term();v=op==="+"?v+n:v-n}return v}let v=expr();if(i!==tokens.length||!Number.isFinite(v))throw Error("Invalid expression");return v}
function studio(w){const b=body(w);b.innerHTML='<div class="toolbar"><input class="field" aria-label="HTML file path" value="Projects/index.html"><button data-run>Run preview</button><button data-save>Save file</button></div><div class="split"><textarea aria-label="HTML source" spellcheck="false"></textarea><iframe class="preview" title="Sandboxed HTML preview" sandbox="allow-scripts"></iframe></div><div class="status">Preview runs in a sandboxed iframe without same-origin access. Do not treat it as a security boundary for hostile code.</div>';const path=b.querySelector("input"),src=b.querySelector("textarea"),frame=b.querySelector("iframe");src.value=read(path.value)||"<h1>Hello</h1><p>Build something.</p>";function run(){frame.srcdoc=src.value}b.querySelector("[data-run]").onclick=run;b.querySelector("[data-save]").onclick=()=>{try{write(path.value,src.value);notify("Saved HTML file")}catch(e){notify(e.message)}};run()}
function settings(w){const b=body(w);b.innerHTML='<h3>Virtual PC settings</h3><p class="muted">This app stores only its simulated workspace in this browser.</p><div class="toolbar"><button data-export>Export workspace JSON</button><button data-import>Import workspace JSON</button><button class="danger" data-reset>Reset workspace</button></div><p class="muted">Browser storage can be cleared by your browser. Export backups regularly.</p>';b.querySelector("[data-export]").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,files:fs},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="virtual-pc-workspace.json";a.click();URL.revokeObjectURL(a.href)};b.querySelector("[data-import]").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{const v=JSON.parse(await i.files[0].text());if(v.version!==1||!v.files||typeof v.files!=="object"||Object.values(v.files).some(x=>typeof x!=="string"))throw Error("Invalid workspace format");fs=v.files;save();notify("Workspace imported. Reopen Explorer.")}catch(e){notify("Import failed: "+e.message)}};i.click()};b.querySelector("[data-reset]").onclick=()=>{if(confirm("Permanently reset this browser's virtual workspace?")){fs=clone(seed);save();notify("Workspace reset")}}}
function launcher(){let p=$("#launcher");if(p){p.remove();return}p=document.createElement("section");p.id="launcher";p.style.cssText="position:absolute;left:10px;bottom:58px;width:260px;padding:12px;background:#111d2ddd;backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:12px;z-index:9998";p.innerHTML="<strong>Virtual PC</strong><div class='file-list' style='grid-template-columns:1fr 1fr;margin-top:10px'></div>";const l=p.querySelector(".file-list");for(const a of APPS){const b=document.createElement("button");b.textContent=a[1]+" "+a[2];b.onclick=()=>{p.remove();openApp(a[0])};l.append(b)}desktop.append(p)}
$("#start").onclick=launcher;for(const a of APPS){const b=document.createElement("button");b.className="desktop-icon";b.innerHTML='<span class="glyph">'+a[1]+'</span><span>'+a[2]+'</span>';b.ondblclick=()=>openApp(a[0]);b.onclick=()=>{document.querySelectorAll(".desktop-icon").forEach(x=>x.style.background="transparent");b.style.background="#ffffff24"};$("#icons").append(b)}
function tick(){$("#clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}tick();setInterval(tick,15000);openApp("explorer");
})();
</script></body></html>
